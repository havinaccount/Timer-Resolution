# GitHub Actions workflow for Python on Windows
# Installs dependencies and runs linting

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint
        if (Test-Path requirements.txt) { pip install -r requirements.txt }

    - name: Lint with pylint
      run: |
        # stop the build if there are Python syntax errors or undefined names. The GitHub editor is 127 chars wide
        pylint __init__.py --disable=redefined-outer-name --disable=unused-argument --disable=line-too-long --max-line-length=127
